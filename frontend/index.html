<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mmeli Global</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app-container">
  
  <!-- ===== STICKY HEADER ===== -->
  <header class="sticky-header">
    <div class="header-top">
      <div class="logo">
        <i class="fas fa-store" style="color:#1e3a8a; font-size:1.6rem;"></i>
        <span class="logo-text">Mmeli Global</span>
      </div>
      <div class="header-actions">
        <button class="cart-btn" id="cartIconBtn">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-badge" id="cartCountBadge">0</span>
        </button>
      </div>
    </div>
    <div class="search-row">
      <i class="fas fa-search search-icon"></i>
      <input type="text" id="searchInput" placeholder="Search products..." />
    </div>
  </header>

  <!-- ===== CATEGORY CHIPS (Horizontal Scroll) ===== -->
  <nav class="category-bar">
    <div class="category-chips" id="categoryChips">
      <span class="chip active" data-category="All">All</span>
      <span class="chip" data-category="Phones">Phones</span>
      <span class="chip" data-category="Cameras">Cameras</span>
      <span class="chip" data-category="Farming">Farming</span>
      <span class="chip" data-category="Construction">Constr.</span>
      <span class="chip" data-category="Electronics">Electronics</span>
      <span class="chip" data-category="Hardware">Hardware</span>
      <span class="chip" data-category="Beauty">Beauty</span>
      <span class="chip" data-category="Fashion">Fashion</span>
    </div>
  </nav>

  <!-- ===== FILTER BAR ===== -->
  <div class="filter-bar">
    <select id="categoryFilter">
      <option value="">All Categories</option>
      <option value="Phones">Phones</option>
      <option value="Cameras">Cameras</option>
      <option value="Farming">Farming</option>
      <option value="Construction">Construction</option>
      <option value="Electronics">Electronics</option>
      <option value="Hardware">Hardware</option>
      <option value="Beauty">Beauty</option>
      <option value="Fashion">Fashion</option>
    </select>
    <select id="subcategoryFilter">
      <option value="">All Subcategories</option>
    </select>
    <input type="number" id="minPrice" placeholder="Min Price" />
    <input type="number" id="maxPrice" placeholder="Max Price" />
    <button class="reset-btn" id="resetFilters">Reset</button>
  </div>

  <!-- ===== PRODUCT GRID ===== -->
  <main class="products-grid" id="productsContainer">
    <!-- Products rendered by JS -->
  </main>

  <!-- ===== STICKY FOOTER ===== -->
  <footer class="sticky-footer">
    <div class="footer-icons">
      <a href="#" class="footer-link active" id="footerHome">
        <i class="fas fa-home"></i>
        <span>Home</span>
      </a>
      <a href="#" class="footer-link" id="footerCategories">
        <i class="fas fa-th-large"></i>
        <span>Categories</span>
      </a>
      <a href="#" class="footer-link" id="footerCart">
        <i class="fas fa-shopping-cart"></i>
        <span>Cart</span>
        <span class="footer-badge" id="footerCartBadge">0</span>
      </a>
      <a href="#" class="footer-link" id="footerAccount">
        <i class="fas fa-user"></i>
        <span>Account</span>
      </a>
      <a href="#" class="footer-link" id="footerMore">
        <i class="fas fa-ellipsis-h"></i>
        <span>More</span>
      </a>
    </div>
  </footer>

  <!-- ===== CART MODAL ===== -->
  <div id="cartModal" class="modal-overlay">
    <div class="modal-container cart-container">
      <div class="modal-header">
        <h3><i class="fas fa-shopping-bag"></i> Your Cart</h3>
        <button class="modal-close" id="closeCartBtn">&times;</button>
      </div>
      <div id="cartItemsContainer"><div class="empty-cart">Cart is empty</div></div>
      <div class="cart-total" id="cartTotalContainer">Total: $0.00</div>
      <button class="checkout-btn" id="checkoutBtn">Proceed to Checkout</button>
    </div>
  </div>

  <!-- ===== PRODUCT MODAL ===== -->
  <div id="productModal" class="modal-overlay">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modalProductTitle">Product</h3>
        <button class="modal-close" id="closeModalBtn">&times;</button>
      </div>
      <div class="product-modal-body">
        <div class="modal-product-image">
          <img id="modalProductImage" src="" alt="Product" />
        </div>
        <div id="modalProductThumbnails" class="thumbnail-row"></div>
        <p id="modalProductDesc"></p>
        <div class="modal-product-price" id="modalProductPrice">$0.00</div>
        <div class="modal-select-row">
          <select id="modalSizeSelect"><option>Size</option></select>
          <select id="modalColorSelect"><option>Color</option></select>
        </div>
        <button class="add-to-cart" id="modalAddToCartBtn">Add to Cart</button>
        <div class="related-products-section">
          <h4>You may also like</h4>
          <div id="relatedProductsGrid" class="related-grid"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
