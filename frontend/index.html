<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mmeli Global – Simple E‑commerce</title>
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
<header>
  <div class="logo" id="logoArea">Mmeli Global</div>
  <div class="cart-icon" onclick="showCart()">🛒 <span id="cartCount">0</span></div>
</header>

<nav class="tabs">
  <button class="active" onclick="showPage('home')">Home</button>
  <button onclick="showPage('tracking')">Track</button>
  <button onclick="showPage('cart')">Cart</button>
  <button onclick="showPage('account')">Account</button>
  <button onclick="showPage('admin')" style="background:#d4af37;">Admin</button>
</nav>

<main id="homePage" class="page active">
  <div id="productsGrid"></div>
  <button id="loadMoreBtn" onclick="loadMore()">Load More</button>
</main>

<main id="trackingPage" class="page">
  <div id="map" style="height:300px;"></div>
  <input type="text" id="trackCode" placeholder="Tracking code"><button onclick="trackOrder()">Track</button>
  <div id="trackInfo"></div>
</main>

<main id="cartPage" class="page">
  <div id="cartItems"></div>
  <div id="cartTotal"></div>
  <button onclick="checkout()">Checkout</button>
</main>

<main id="accountPage" class="page">
  <div id="authBox">
    <h3>Login with Phone</h3>
    <input id="loginPhone" placeholder="Phone number"><br>
    <input id="loginPassword" type="password" placeholder="Password"><br>
    <button onclick="login()">Login</button>
    <hr>
    <h3>Register</h3>
    <input id="regName" placeholder="Full name"><br>
    <input id="regPhone" placeholder="Phone number"><br>
    <input id="regPassword" type="password" placeholder="Password"><br>
    <button onclick="register()">Register</button>
  </div>
  <div id="dashboard" style="display:none;">
    <h3>Welcome, <span id="userName"></span></h3>
    <button onclick="logout()">Logout</button>
    <div id="userOrders"></div>
  </div>
</main>

<main id="adminPage" class="page">
  <div id="adminLoginBox">
    <h3>Admin Login</h3>
    <input id="adminEmail" placeholder="Email"><br>
    <input id="adminPassword" type="password" placeholder="Password"><br>
    <button onclick="adminLogin()">Login</button>
  </div>
  <div id="adminPanel" style="display:none;">
    <h3>Admin Panel</h3>
    <button onclick="showProductsModal()">Manage Products</button>
    <button onclick="showBulkImport()">Bulk Import (Excel/CSV)</button>
  </div>
</main>

<!-- Modals -->
<div id="bulkModal" style="display:none; position:fixed; top:20%; left:20%; background:white; padding:20px; z-index:1000;">
  <h3>Import Products</h3>
  <label><input type="radio" name="clear" value="none" checked> Keep existing</label>
  <label><input type="radio" name="clear" value="all"> Delete all first</label><br>
  <input type="file" id="bulkFile" accept=".xlsx,.xls,.csv"><br>
  <button onclick="importProducts()">Import</button>
  <div id="importStatus"></div>
  <button onclick="closeModal('bulkModal')">Close</button>
</div>

<div id="productsModal" style="display:none; position:fixed; top:10%; left:10%; background:white; width:80%; padding:20px; z-index:1000; overflow:auto; max-height:80%;">
  <h3>Products</h3>
  <div id="productsList"></div>
  <button onclick="closeModal('productsModal')">Close</button>
</div>

<script>
  // Only for closing modals
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
</script>
</body>
</html>
